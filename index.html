<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rudolstadt Rausch</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--tx:#f6f0dc;--ac:#f2b632;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:#15221a;color:var(--tx);font-family:'Lilita One',system-ui,sans-serif;touch-action:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;gap:14px;background:rgba(12,20,14,.8);text-align:center;padding:20px;box-sizing:border-box}
.ov p{margin:0;max-width:32ch;font-family:system-ui,sans-serif;font-size:15px;line-height:1.4}
h1{font-size:36px;margin:0;font-weight:400;line-height:1.05}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(390px,100%)}
button{font:inherit;font-size:22px;color:#14181a;border:0;border-radius:14px;padding:16px 8px;background:var(--c,#f2b632)}
button:focus-visible{outline:3px solid #fff}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:10px 14px;display:none;pointer-events:none;text-shadow:0 1px 3px #000}
.t{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:20px}
.bar{flex:1;height:10px;border-radius:5px;background:rgba(0,0,0,.45);overflow:hidden}
.bar u{display:block;height:100%;background:var(--ac)}
.s{display:flex;gap:10px;margin-top:6px;font-size:15px;flex-wrap:wrap}
#toast{position:fixed;top:32%;left:0;right:0;text-align:center;font-size:40px;opacity:0;transition:opacity .3s;pointer-events:none;text-shadow:0 2px 6px #000}
#jr{position:fixed;width:90px;height:90px;border-radius:50%;border:3px solid rgba(255,255,255,.6);display:none;pointer-events:none}
#jk{position:absolute;left:30px;top:30px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.8)}
ol{margin:0;padding:0;list-style:none;font-size:20px;line-height:1.6}
#ab{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-size:17px;padding:14px 16px;max-width:55vw;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#ab:disabled{opacity:.55}
#nm{font:inherit;font-size:20px;padding:12px 14px;border-radius:12px;border:2px solid #f2b632;background:#1b2a1f;color:var(--tx);width:min(340px,100%);box-sizing:border-box;text-align:center;user-select:text;-webkit-user-select:text}
#nmh{color:#ffb4a8}
#lb{background:rgba(12,20,14,.96)}
.slot{display:flex;gap:8px;padding:14px 16px;border-radius:18px;background:linear-gradient(#b3262c,#7a1519);border:4px solid #f2b632;animation:pop .5s ease-out}
.slot span{display:block;width:64px;height:76px;line-height:76px;font-size:44px;background:#fff;border-radius:10px;color:#000}
@keyframes pop{from{transform:translateY(60px) scale(.6);opacity:0}to{transform:none;opacity:1}}
</style></head><body>
<div id="hud"></div><div id="toast"></div><div id="jr"><div id="jk"></div></div>
<div class="ov" id="menu"><h1>Rudolstadt Rausch</h1><p>Sammle Bier und Joints, steig im Level auf und schlag die anderen in 60 Sekunden. Steuern mit Finger ziehen oder WASD. Jeder hat eine Fähigkeit pro Runde (Button oder Leertaste).</p><input id="nm" maxlength="16" placeholder="Dein Benutzername" autocomplete="off"><p id="nmh"></p><div class="g" id="pick"></div><button id="lbb" style="--c:#cbd5e1;font-size:18px">🏆 Leaderboard</button></div>
<button id="ab" style="display:none"></button>
<div class="ov" id="end" style="display:none"></div>
<div class="ov" id="lb" style="display:none"></div>

async function lbSubmit(name,score){const k=keyOf(name),upd=u=>({name,best:Math.max(nn(u.best),score),total:nn(u.total)+score,rounds:nn(u.rounds)+1,t:Date.now()});
 if(LB_URL){try{const o=(await(await fetch(`${LB_URL}/users/${k}.json`)).json())||{};await fetch(`${LB_URL}/users/${k}.json`,{method:'PUT',body:JSON.stringify(upd(o))});return true}catch(e){}}
 const o=localLb();o[k]=upd(o[k]||{});ls.set('rr_lb',JSON.stringify(o));return false}
let lbm='total';
async function openLb(m){if(m)lbm=m;const o=$('lb');o.style.display='flex';o.innerHTML='<h1>🏆 Leaderboard</h1><p>Lade …</p>';
 const{rows,pub}=await lbLoad();rows.sort((a,b)=>nn(b[lbm])-nn(a[lbm]));
 o.innerHTML=`<h1>🏆 Leaderboard</h1><div class="g" style="grid-template-columns:1fr 1fr"><button id="lt" style="--c:${lbm=='total'?'#f2b632':'#cbd5e1'}">Gesamt</button><button id="lr" style="--c:${lbm=='best'?'#f2b632':'#cbd5e1'}">Beste Runde</button></div><ol>${rows.slice(0,20).map((u,i)=>`<li>${i+1}. ${esc(u.name)}: ${lbm=='total'?nn(u.total)+' Punkte (beste Runde '+nn(u.best)+')':nn(u.best)+' Punkte (gesamt '+nn(u.total)+')'}</li>`).join('')||'<li>Noch keine Einträge.</li>'}</ol>${pub?'':'<p>Das öffentliche Leaderboard ist noch nicht verbunden. Du siehst nur Einträge von diesem Gerät.</p>'}<button id="lc" style="--c:#cbd5e1">Schließen</button>`;
 $('lt').onclick=()=>openLb('total');$('lr').onclick=()=>openLb('best');$('lc').onclick=()=>{o.style.display='none'}}
CH.forEach((ch,i)=>{const b=document.createElement('button');b.innerHTML=`<img src="${FACES[ch.k]}" alt="" style="width:60px;height:60px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 6px">${ch.n}<small style="display:block;font:13px system-ui,sans-serif">${AB[ch.k].n}</small>`;b.style.setProperty('--c',hx(ch.t||ch.c));b.onclick=()=>{const n=nmClean();if(!nmOk(n)){$('nmh').textContent='Bitte gib einen Benutzernamen ein: 2 bis 16 Zeichen, nur Buchstaben, Zahlen, Leerzeichen, _ oder -.';$('nm').focus();return}uname=n;ls.set('rr_name',n);start(i)};$('pick').appendChild(b)});
// Touch-Joystick
const jr=$('jr'),jk=$('jk');
addEventListener('touchstart',e=>{if(st!=='play')return;const t=e.changedTouches[0];if(me.bat)tapTp(t.clientX,t.clientY);j0={x:t.clientX,y:t.clientY};jr.style.display='block';jr.style.left=t.clientX-45+'px';jr.style.top=t.clientY-45+'px'},{passive:true});
addEventListener('touchmove',e=>{if(!j0)return;const t=e.touches[0];let x=(t.clientX-j0.x)/45,y=(t.clientY-j0.y)/45;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}jv={x,y};jk.style.transform=`translate(${x*30}px,${y*30}px)`},{passive:true});
addEventListener('touchend',e=>{if(e.touches.length)return;j0=null;jv={x:0,y:0};jr.style.display='none';jk.style.transform=''});
$('ab').onclick=()=>ab(me);$('ab').addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
addEventListener('mousedown',e=>{if(st==='play'&&me.bat&&e.target===rd.domElement)tapTp(e.clientX,e.clientY)});
$('nm').value=ls.get('rr_name')||'';$('lbb').onclick=()=>openLb();
function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1000||0,.05);last=t;
 if(st==='play'){step(dt);hudT-=dt;if(st==='play'&&hudT<=0){hud();hudT=.1}}
 IT.forEach(o=>{o.g.rotation.y+=dt*2;o.g.position.y=(o.k==='super'?1.8:1)+Math.sin(t/300+o.x)*.2});
 if(st==='play'){cam.position.lerp(new THREE.Vector3(me.x,14,me.z+14),Math.min(1,dt*5));cam.lookAt(me.x,0,me.z-3)}
 else{const a=t/6000;cam.position.set(Math.sin(a)*40,20,Math.cos(a)*40);cam.lookAt(0,2,0)}
 rd.render(sc,cam)}
requestAnimationFrame(loop);
</script></body></html>
