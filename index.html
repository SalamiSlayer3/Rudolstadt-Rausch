<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rudolstadt Rausch</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--tx:#fff7e6;--ac:#ffc23d;--ac2:#ff7a1a;--gl:rgba(16,22,20,.66);--bd:rgba(255,255,255,.13);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#15221a;color:var(--tx);font-family:'Lilita One',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 120% 90% at 50% 45%,transparent 58%,rgba(0,0,0,.42))}
#hit{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(220,20,20,.55));transition:opacity .45s}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;gap:12px;background:linear-gradient(180deg,rgba(6,10,8,.25),rgba(6,10,8,.82) 38%,rgba(6,10,8,.92));text-align:center;padding:max(18px,env(safe-area-inset-top)) 14px max(22px,env(safe-area-inset-bottom));touch-action:pan-y}
.ov p{margin:0;max-width:40ch;font-family:system-ui,sans-serif;font-size:15px;line-height:1.45}
h1{font-size:34px;margin:0;font-weight:400;line-height:1.05;text-shadow:0 3px 0 rgba(0,0,0,.35)}
button{font:inherit;font-size:21px;color:#14181a;border:0;border-radius:14px;padding:14px 10px;background:var(--c,#ffc23d);box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 -3px 0 rgba(0,0,0,.12),inset 0 2px 0 rgba(255,255,255,.35);cursor:pointer;transition:transform .08s,filter .15s}
button:hover{filter:brightness(1.08)}button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(460px,100%)}
/* Menue */
.hero{margin:6px 0 2px;animation:drop .7s cubic-bezier(.2,1.4,.4,1) both}
.logo{font-size:clamp(34px,10vw,54px);line-height:.88;color:#fff;transform:rotate(-3deg);text-shadow:0 3px 0 #a8461a,0 6px 0 #5e2109,0 12px 26px rgba(0,0,0,.55);letter-spacing:.5px}
.logo b{display:block;font-weight:400;font-size:1.32em;background:linear-gradient(180deg,#fff6c4 8%,#ffc23d 46%,#ff6a1a 92%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 0 #6e2709) drop-shadow(0 0 22px rgba(255,140,40,.45));animation:wob 3.2s ease-in-out infinite}
.tag{margin:10px auto 0!important;color:#ffe3a3;font-size:14px!important;letter-spacing:.3px;opacity:.9}
@keyframes wob{50%{transform:scale(1.035) rotate(.6deg)}}
@keyframes drop{from{transform:translateY(-40px) scale(.8);opacity:0}}
.pn{width:min(460px,100%);background:var(--gl);border:1px solid var(--bd);border-radius:20px;padding:12px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.35);animation:rise .5s ease-out both}
.pn:nth-of-type(2){animation-delay:.06s}.pn:nth-of-type(3){animation-delay:.12s}.pn:nth-of-type(4){animation-delay:.18s}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.pn h2{margin:0 0 9px;font-weight:400;font-size:17px;letter-spacing:.6px;color:var(--ac);text-align:left;display:flex;align-items:center;gap:8px}
.pn h2 i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ac);color:#1a1206;font-size:13px}
#nm{font:inherit;font-size:20px;padding:11px 14px;border-radius:12px;border:2px solid rgba(255,194,61,.75);background:rgba(0,0,0,.35);color:var(--tx);width:100%;text-align:center;user-select:text;-webkit-user-select:text;outline:none;transition:border-color .2s,box-shadow .2s}
#nm:focus{border-color:#ffd877;box-shadow:0 0 0 4px rgba(255,194,61,.2)}
#nmh{color:#ffb4a8;font-size:13px;margin-top:6px}#nmh:empty{display:none}
.maps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 9px;background:rgba(255,255,255,.07);color:var(--tx);border:2px solid transparent;box-shadow:none;font-size:16px;border-radius:14px}
.mc .ic{font-size:28px;line-height:1.1}.mc small{font:11px/1.25 system-ui,sans-serif;opacity:.72}
.mc.on{background:linear-gradient(180deg,rgba(255,194,61,.32),rgba(255,122,26,.18));border-color:var(--ac);box-shadow:0 0 18px rgba(255,194,61,.3)}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cc{position:relative;display:flex;flex-direction:column;align-items:center;padding:9px 4px 8px;background:rgba(255,255,255,.06);color:var(--tx);border:2px solid transparent;box-shadow:none;font-size:17px;border-radius:14px;overflow:hidden}
.cc:before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--c)}
.cc img{width:54px;height:54px;border-radius:50%;object-fit:cover;display:block;margin:2px auto 5px;box-shadow:0 0 0 3px var(--c),0 4px 10px rgba(0,0,0,.4);transition:transform .2s}
.cc small{display:block;font:11px/1.2 system-ui,sans-serif;opacity:.75;margin-top:1px}
.cc.on{border-color:var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 38%,transparent),rgba(255,255,255,.05));box-shadow:0 0 18px color-mix(in srgb,var(--c) 45%,transparent)}
.cc.on img{transform:scale(1.1)}
#chinfo{margin-top:9px;font:13.5px/1.4 system-ui,sans-serif;color:#f2e6c8;min-height:38px;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.28);text-align:left}
#chinfo b{font-family:'Lilita One',system-ui;font-weight:400;color:var(--ac);font-size:15px}
.go{width:min(460px,100%);font-size:27px;padding:16px;letter-spacing:1px;background:linear-gradient(180deg,#ffe07a,#ffb21f 55%,#ff7a1a);color:#2a1300;box-shadow:0 5px 0 #8a3c0a,0 0 28px rgba(255,160,40,.45);animation:pulse 1.8s ease-in-out infinite}
.ov>.go{position:sticky;bottom:6px;z-index:3}
@keyframes pulse{50%{box-shadow:0 5px 0 #8a3c0a,0 0 44px rgba(255,170,40,.75)}}
.row{display:flex;gap:8px;width:min(460px,100%)}.row button{flex:1;font-size:15px;padding:11px 6px;--c:#d9dee6}
.row button.sm{flex:0 0 52px}
/* Anleitung */
.help{text-align:left;font:14px/1.5 system-ui,sans-serif}.help h3{font:400 17px 'Lilita One',system-ui;color:var(--ac);margin:10px 0 4px}
.help table{width:100%;border-collapse:collapse}.help td{padding:3px 4px;border-bottom:1px solid rgba(255,255,255,.08)}.help td:last-child{text-align:right;color:var(--ac);font-weight:700}
/* HUD */
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:10px 12px;display:none;pointer-events:none;text-shadow:0 1px 3px #000}
.hb{display:flex;gap:10px;align-items:center}
.tm{flex:0 0 auto;min-width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:radial-gradient(circle at 50% 35%,rgba(40,40,40,.75),rgba(0,0,0,.7));border:3px solid var(--ac);box-shadow:0 4px 12px rgba(0,0,0,.4)}
.tm.lo{border-color:#ff4a3a;color:#ffd2cc;animation:beat .5s ease-in-out infinite alternate}
@keyframes beat{to{transform:scale(1.1)}}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.lv{display:flex;align-items:center;gap:8px;font-size:17px}
.bar{flex:1;height:10px;border-radius:5px;background:rgba(0,0,0,.5);overflow:hidden;border:1px solid rgba(255,255,255,.18)}
.bar u{display:block;height:100%;background:linear-gradient(90deg,#ffc23d,#ff7a1a);transition:width .25s}
.inv{display:flex;gap:6px;flex-wrap:wrap;font-size:17px}.inv span{background:rgba(0,0,0,.45);padding:2px 9px;border-radius:999px}
.nx{margin-top:7px;font:13px system-ui,sans-serif;color:#ffe9b8;min-height:16px}
.sb{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.sb span{background:rgba(0,0,0,.5);border-radius:999px;padding:3px 10px 3px 8px;font-size:15px;border-left:4px solid var(--c);transition:transform .2s}
.sb span.ld{transform:scale(1.08);background:rgba(60,40,0,.6)}.sb span.me{box-shadow:0 0 0 2px rgba(255,255,255,.55)}
#toast{position:fixed;top:30%;left:0;right:0;padding:0 18px;text-align:center;font-size:clamp(22px,5.4vw,36px);opacity:0;transition:opacity .3s,transform .3s;transform:scale(.85);pointer-events:none;text-shadow:0 2px 0 #000,0 0 14px rgba(0,0,0,.7)}
#toast.on{opacity:1;transform:none}
#cd{position:fixed;inset:0;display:none;place-items:center;pointer-events:none;font-size:min(34vw,190px);color:#fff;text-shadow:0 6px 0 #a8461a,0 12px 30px rgba(0,0,0,.6)}
#cd span{animation:cdp .9s ease-out both}@keyframes cdp{from{transform:scale(2.2);opacity:0}30%{transform:scale(1);opacity:1}to{transform:scale(.8);opacity:0}}
#jr{position:fixed;width:90px;height:90px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(255,255,255,.06);display:none;pointer-events:none}
#jk{position:absolute;left:27px;top:27px;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#d8d8d8);box-shadow:0 2px 6px rgba(0,0,0,.4)}
ol{margin:0;padding:0;list-style:none;font-size:19px;line-height:1.6}
.rk{width:min(460px,100%);display:flex;flex-direction:column;gap:5px}
.rk li{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.06);text-align:left;font-size:17px}
.rk li .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rk li .v{color:var(--ac)}.rk li small{font:12px system-ui,sans-serif;opacity:.7;display:block}
.rk li.me{background:rgba(255,194,61,.22);box-shadow:inset 0 0 0 2px rgba(255,194,61,.6)}
.rk li .p{width:30px;text-align:center;font-size:19px}
#ab{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-size:17px;padding:14px 16px;max-width:55vw;box-shadow:0 4px 0 rgba(0,0,0,.4),0 0 18px color-mix(in srgb,var(--c) 55%,transparent)}
#ab.rd{animation:abp 1.2s ease-in-out infinite}@keyframes abp{50%{transform:scale(1.06)}}
#ab:disabled{opacity:.55;animation:none}
#lb{background:rgba(6,10,8,.95)}
/* Spielautomat */
.sm{position:relative;margin-right:26px;padding:12px 16px 14px;border-radius:24px;background:linear-gradient(180deg,#e0353b,#8a1a1e 70%,#5e0f12);border:4px solid #ffc23d;box-shadow:0 0 0 4px #4a0a0c,0 14px 40px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.35);animation:pop .55s cubic-bezier(.2,1.5,.4,1) both;transition:filter 1s,transform 1s}
.sm:before{content:"";position:absolute;inset:5px;border-radius:18px;border:3px dotted #fff3b0;opacity:.85;pointer-events:none;animation:blink .45s steps(2) infinite}
.sm.spin:before{animation-duration:.12s}
@keyframes blink{50%{border-color:#ff4fa3}}
.smt{font-size:18px;color:#fff3c4;text-shadow:0 2px 0 #4a0a0c;margin:2px 0 9px;letter-spacing:1.5px}
.slot{display:flex;gap:7px;padding:9px;border-radius:14px;background:#2a0608;box-shadow:inset 0 4px 12px rgba(0,0,0,.8)}
.slot span{display:block;width:66px;height:80px;line-height:80px;font-size:46px;background:linear-gradient(180deg,#d8d8d8,#fff 30%,#fff 70%,#d0d0d0);border-radius:9px;color:#000;overflow:hidden;transition:background .3s,box-shadow .3s}
.slot span.spin{animation:reel .1s linear infinite;filter:blur(1.4px)}
@keyframes reel{from{transform:translateY(-22%)}to{transform:translateY(22%)}}
.slot span.stop{animation:land .38s cubic-bezier(.2,1.7,.4,1)}
@keyframes land{from{transform:translateY(-45%)}to{transform:none}}
.slot span.hit{background:linear-gradient(180deg,#fff2a8,#ffd24a);box-shadow:0 0 22px #ffd24a,inset 0 0 0 3px #fff}
.slot span.bad{background:linear-gradient(180deg,#8a8f99,#5a5f69);filter:grayscale(1)}
.smb{font:13px system-ui,sans-serif;color:#ffe3e3;margin-top:9px}
.lever{position:absolute;right:-24px;top:26px;width:12px;height:72px;background:linear-gradient(90deg,#888,#f2f2f2,#888);border-radius:6px;transform-origin:50% 100%}
.lever i{position:absolute;top:-16px;left:-9px;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a8a,#b3121a 70%);box-shadow:0 3px 6px rgba(0,0,0,.4)}
.lever.pull{animation:pull .6s ease-in-out}@keyframes pull{45%{transform:scaleY(-.55)}}
.sm.win{animation:wig .09s 14 alternate;box-shadow:0 0 0 4px #4a0a0c,0 0 60px 12px rgba(255,210,74,.8)}@keyframes wig{from{transform:rotate(-2deg) scale(1.03)}to{transform:rotate(2deg) scale(1.06)}}
.sm.lose{filter:grayscale(.9) brightness(.7);transform:rotate(-4deg) translateY(10px)}
.bets{width:min(460px,100%)}.bets button small,#gk small{display:block;font:12px system-ui,sans-serif;opacity:.8;margin-top:2px}
/* Effekt-Ebene */
#fxo{position:fixed;inset:0;z-index:30;pointer-events:none;display:none;place-items:center;overflow:hidden}
#fxo canvas{position:absolute;inset:0;width:100%;height:100%}
#fxo .fl{position:absolute;inset:0;background:#fff;animation:fla .7s ease-out forwards}@keyframes fla{to{opacity:0}}
#fxo .rays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;background:repeating-conic-gradient(rgba(255,210,74,.32) 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 55%);mask:radial-gradient(circle,#000 8%,transparent 55%);animation:spin 7s linear infinite,fin .6s ease-out}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes fin{from{opacity:0}}
#fxo .big{position:relative;font-size:clamp(44px,12.5vw,108px);line-height:.95;text-align:center;padding:0 10px}
#fxo .big .num{display:block;font-size:.5em;margin-top:8px}
#fxo .big.w{color:#fff7c8;text-shadow:0 5px 0 #b8541b,0 10px 0 #5e2109,0 0 40px rgba(255,190,50,.9);animation:boom .85s cubic-bezier(.2,1.6,.3,1) both,glw 1s .85s ease-in-out infinite alternate}
@keyframes boom{from{transform:scale(5) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}@keyframes glw{to{transform:scale(1.06)}}
#fxo .big.l{color:#a9bcd8;text-shadow:0 4px 0 #1b2638,0 0 30px rgba(0,0,0,.6);animation:droop 3.4s ease-in both}
#fxo .big.l .cry{display:block;font-size:.9em;animation:sink 3.4s ease-in both}
@keyframes droop{0%{transform:translateY(-40px);opacity:0}15%{transform:none;opacity:1}100%{transform:translateY(50px) rotate(5deg) scale(.92);opacity:.85}}
@keyframes sink{0%,30%{transform:none}50%{transform:translateY(6px) rotate(-6deg)}70%{transform:translateY(12px) rotate(6deg)}100%{transform:translateY(26px)}}
#end,#gc{transition:filter 1.2s}body.sad #end,body.sad #gc{filter:grayscale(1) brightness(.6)}
#pod{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;align-items:center;gap:12px;z-index:25;pointer-events:none;padding:0 12px;text-align:center}
#pod .pt{font-size:clamp(30px,8vw,58px);color:#fff;text-shadow:0 4px 0 #a8461a,0 8px 0 #5e2109,0 0 26px rgba(255,170,40,.75);animation:boom .8s 2.7s cubic-bezier(.2,1.6,.3,1) both}
#pod button{pointer-events:auto;font-size:16px;padding:10px 22px;--c:#d9dee6;opacity:.9}
.shk{animation:shk .55s}@keyframes shk{20%{transform:translate(-10px,5px)}40%{transform:translate(9px,-7px)}60%{transform:translate(-6px,6px)}80%{transform:translate(5px,-4px)}}
@keyframes pop{from{transform:translateY(60px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.tabs{display:grid;gap:6px;width:min(460px,100%)}.tabs button{font-size:15px;padding:10px 4px}
@media (min-width:900px) and (min-height:560px){#menu{display:grid;grid-template-columns:minmax(0,400px) minmax(0,500px);grid-template-rows:auto auto auto 1fr auto;justify-content:center;align-content:safe center;column-gap:16px;row-gap:12px}
 #menu .hero{grid-column:1/-1}#pnN{grid-column:1;grid-row:2}#pnM{grid-column:1;grid-row:3}#pnC{grid-column:2;grid-row:2/5;align-self:start}#menu .go{grid-column:1;grid-row:4;align-self:end}#mrow{grid-column:1/-1;grid-row:5;width:auto;max-width:916px;justify-self:stretch}
 #menu .pn,#menu .go{width:100%}}
@media (max-width:520px){.cc{padding:7px 3px 6px;font-size:16px}.cc img{width:46px;height:46px;margin-bottom:3px}.cc small{font-size:10px}.mc{padding:8px 3px 7px}.mc small{display:none}.pn{padding:10px}}
@media (max-height:700px){.logo{font-size:clamp(30px,8vw,44px)}.cc img{width:44px;height:44px}.mc .ic{font-size:22px}}
</style></head><body>
<div id="hud"></div><div id="vig"></div><div id="hit"></div><div id="toast"></div><div id="cd"></div><div id="jr"><div id="jk"></div></div>
<div class="ov" id="menu">
 <div class="hero"><div class="logo">Rudolstadt<b>Rausch</b></div><p class="tag">60 Sekunden · 4 Spieler · nur einer gewinnt</p></div>
 <div class="pn" id="pnN"><h2><i>1</i>Dein Name</h2><input id="nm" maxlength="16" placeholder="Benutzername" autocomplete="off" enterkeyhint="done"><p id="nmh"></p></div>
 <div class="pn" id="pnM"><h2><i>2</i>Map</h2><div class="maps" id="maps"></div></div>
 <div class="pn" id="pnC"><h2><i>3</i>Charakter</h2><div class="chars" id="pick"></div><div id="chinfo"></div></div>
 <button class="go" id="go">▶ LOS GEHT'S</button>
 <div class="row" id="mrow"><button id="lbb">🏆 Leaderboard</button><button id="howb">❓ Anleitung</button><button id="gfx">✨</button><button id="snd" class="sm">🔊</button></div>
</div>
<button id="ab" style="display:none"></button>
<div class="ov" id="end" style="display:none"></div>
<div class="ov" id="lb" style="display:none"></div>
<div class="ov" id="how" style="display:none"></div>
<div id="fxo"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
