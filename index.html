<html lang="de"><head><meta charset="utf-8">

<title>Rudolstadt Rausch</title>

<style>
:root{color-scheme:dark;--tx:#f6f0dc;--ac:#f2b632;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:#15221a;color:var(--tx);font-family:'Lilita One',system-ui,sans-serif;touch-action:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(12,20,14,.8);text-align:center;padding:20px;box-sizing:border-box}
.ov p{margin:0;max-width:32ch;font-family:system-ui,sans-serif;font-size:15px;line-height:1.4}
h1{font-size:36px;margin:0;font-weight:400;line-height:1.05}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(340px,100%)}
button{font:inherit;font-size:22px;color:#14181a;border:0;border-radius:14px;padding:16px 8px;background:var(--c,#f2b632)}
button:focus-visible{outline:3px solid #fff}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:10px 14px;display:none;pointer-events:none;text-shadow:0 1px 3px #000}
.t{display:flex;gap:12px;align-items:center;font-size:20px}
.bar{flex:1;height:10px;border-radius:5px;background:rgba(0,0,0,.45);overflow:hidden}
.bar u{display:block;height:100%;background:var(--ac)}
.s{display:flex;gap:10px;margin-top:6px;font-size:15px;flex-wrap:wrap}
#toast{position:fixed;top:32%;left:0;right:0;text-align:center;font-size:40px;opacity:0;transition:opacity .3s;pointer-events:none;text-shadow:0 2px 6px #000}
#jr{position:fixed;width:90px;height:90px;border-radius:50%;border:3px solid rgba(255,255,255,.6);display:none;pointer-events:none}
#jk{position:absolute;left:30px;top:30px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.8)}
ol{margin:0;padding:0;list-style:none;font-size:20px;line-height:1.6}
#ab{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-size:17px;padding:14px 16px;max-width:55vw;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#ab:disabled{opacity:.55}
</style></head><body>

<div class="ov" id="menu"><h1>Rudolstadt Rausch</h1><p>Sammle Bier und Joints, steig im Level auf und schlag die anderen in 60 Sekunden. Steuern mit Finger ziehen oder WASD. Jeder hat eine Fähigkeit pro Runde (Button oder Leertaste).</p><div class="g" id="pick"></div></div>
